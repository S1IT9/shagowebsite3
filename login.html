<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | SHAGO</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#07080b;--surface:#0f1217;--line:#262b35;--fg:#f4f6f9;--muted:#9aa3b2;--accent:#ffc21a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 400px at 90% 0,rgba(255,120,20,.15),transparent 60%),var(--bg);color:var(--fg);font:16px Manrope,sans-serif}.wrap{max-width:1100px;margin:auto;padding:0 20px}header{padding:20px 0;border-bottom:1px solid var(--line)}header .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font:800 23px Sora,sans-serif;color:var(--fg);text-decoration:none}.back{color:var(--fg);text-decoration:none;font-weight:700}main{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:35px 20px}.panel{width:min(100%,430px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:.15em;text-transform:uppercase}h1{font:800 35px Sora,sans-serif;margin:12px 0}p{color:var(--muted);line-height:1.6}label{display:grid;gap:8px;margin:18px 0;font-size:14px;font-weight:700}input{width:100%;background:#171b22;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:14px;font:16px Manrope,sans-serif}input:focus{outline:2px solid var(--accent)}button{width:100%;border:0;border-radius:10px;padding:14px;background:linear-gradient(135deg,#ffd23d,#ff9a1a);font:800 15px Manrope,sans-serif;cursor:pointer;margin-top:10px}.small{font-size:12px;color:var(--muted);margin-top:18px}</style></head><body><header><div class="wrap"><a class="brand" href="index.html">◈ SHAGO</a><a class="back" href="index.html">← Back to home</a></div></header><main><section class="panel"><span class="eyebrow">Welcome to SHAGO</span><h1>Login to book a ride</h1><p>Enter your details to continue to the ride-booking window.</p><form id="login"><label>Your name<input id="name" autocomplete="name" placeholder="Enter your name" required maxlength="60"></label><label>Mobile number<input id="mobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required></label><button type="submit">Continue to book a ride →</button></form><p class="small">Project demo login only. No SMS OTP or real account verification is performed.</p></section></main><script>document.getElementById('login').addEventListener('submit',function(e){e.preventDefault();if(!this.reportValidity())return;sessionStorage.setItem('shago-demo-login','yes');location.href='book-ride.html'});</script></body></html>
